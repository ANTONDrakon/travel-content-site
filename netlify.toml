# TravelHub - Netlify Configuration

[build]
  publish = "docs"
  command = "python main.py build"

# ─── Headers ──────────────────────────────────────────────────────

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{jpg,jpeg,png,gif,ico,webp,svg}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{woff,woff2,ttf,eot}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.{xml,json}"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ─── Security Headers ─────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), gelocation=()"

# ─── Redirects ────────────────────────────────────────────────────

[[redirects]]
  from = "/home"
  to = "/en/index.html"
  status = 301

[[redirects]]
  from = "/ru"
  to = "/ru/index.html"
  status = 301

# ─── Plugins ──────────────────────────────────────────────────────

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    audits = [
      { url = "/", resultGroup = "performance", threshold = 0.9 },
      { url = "/", resultGroup = "accessibility", threshold = 0.9 }
    ]
